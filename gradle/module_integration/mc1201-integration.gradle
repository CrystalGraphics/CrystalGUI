// Groovy script — applied from each mc1201 loader's build.gradle.kts.
//
// Mirrors integration.gradle but targets mc1201 loaders instead of the mc1710 GTNH/RFG stack.
//
// What it does:
//   - Reads mc1201CompileDeps from each submoduleMod entry in submodules.gradle.kts
//   - Adds them as compileOnly + runtimeOnly so loader sources can import CrystalGraphics APIs
//
// Composite build substitution (in composite.settings.gradle.kts) resolves each GAV to the
// matching CrystalGraphics project in the CrystalGraphics includeBuild:
//   com.crystalgraphics:core                         → CrystalGraphics :core
//   com.crystalgraphics:platform                     → CrystalGraphics :platform
//   com.crystalgraphics:crystalgraphics-mc1201-common → CrystalGraphics :mc1201:common
//
// Fabric dev runs: runtimeOnly deps land on Loom's runtimeClasspath — no extra setup needed.
// Forge/NeoForge dev runs: ModDevGradle does NOT read runtimeClasspath for the mod class loader.
//   CrystalGraphics classes are available at compile time but NOT in dev runs via this mechanism.
//   For dev runs, build and place the CrystalGraphics mc1201 loader JAR in the mods/ directory,
//   or add CrystalGraphics as a modLocalRuntime dependency once its mc1201 artifacts are published.

apply from: rootProject.file("gradle/module_integration/submodules.gradle.kts").toURI()

List<Map<String, Object>> submoduleMods = project.ext["submoduleMods"] as List<Map<String, Object>>

def stringList = { Map<String, Object> m, String key ->
    def v = m.get(key)
    (v instanceof List) ? v.findAll { it instanceof String } : []
}

dependencies {
    submoduleMods.collectMany { stringList(it, "mc1201CompileDeps") }
                 .unique()
                 .each { dep ->
                     // compileOnly: loader sources can import CrystalGraphics APIs.
                     add("compileOnly", dep)
                     // runtimeOnly: Fabric/Loom dev runs pick these up from runtimeClasspath.
                     // ModDevGradle (Forge/NeoForge) dev runs ignore runtimeClasspath — see note above.
                     add("runtimeOnly", dep)
                 }
}
