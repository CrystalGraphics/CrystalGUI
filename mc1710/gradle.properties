# mc1710 — Minecraft 1.7.10 + Forge 10.13.4 build configuration.
# Properties specific to this version target live here.
# Shared dep versions (taffy_version, jomlVersion) and org.gradle.* flags live in root gradle.properties.

# Project identity (re-stated here so gtnhconvention finds them in subproject context,
# since Gradle looks in subproject gradle.properties before root).
modName = CrystalGUI
modId = crystalgui
modGroup = com.crystalgui
modVersion = 1.0.0
useModGroupForPublishing = true

# Updates your build.gradle and settings.gradle automatically whenever an update is available.
autoUpdateBuildScript = false

# Version of Minecraft to target
minecraftVersion = 1.7.10

# Version of Minecraft Forge to target
forgeVersion = 10.13.4.1614

# Specify an MCP channel for dependency deobfuscation and the deobfParams task.
channel = stable

# Specify an MCP mappings version for dependency deobfuscation and the deobfParams task.
mappingsVersion = 12

# Defines other MCP mappings for dependency deobfuscation.
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Select a default username for testing your mod.
developmentEnvironmentUserName = sussyhussy

# Enables modern Java syntax support.
enableModernJavaSyntax = jvmDowngrader

# Target JVM version for JVM Downgrader bytecode downgrading.
downgradeTargetVersion = 8

# Specifies how JVM Downgrader API stubs are provided.
jvmDowngraderStubsProvider = shade

# Enables injecting missing generics into the decompiled source code.
enableGenericInjection = true

# Generate a class with a String field for the mod version.
generateGradleTokenClass = com.crystalgui.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =

# API package (empty = no API)
apiPackage =

# Access transformers (empty = none)
accessTransformersFile =

# Mixins
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =

# Core mod entry class (empty = none)
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# Shadow jar settings.
usesShadowedDependencies = true
minimizeShadowedDependencies = false
relocateShadowedDependencies = true

# Adds CurseMaven, Modrinth, and some more well-known 1.7.10 repositories.
includeWellKnownRepositories = true
excludeWellKnownRepositories =

# Publishing
usesMavenPublishing = true
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

# Run directories (relative to :mc1710 project directory)
runServerWorkingDirectory = run/server

# Build quality
disableSpotless = true
disableCheckstyle = true

# Disable IDE integration module — idea.project is only non-null on the root project
# in a multi-project build. Root handles IDEA setup via apply plugin: 'idea'.
gtnh.modules.ideIntegration = false
