/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 */
dependencies {
    //runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.7.69-GTNH:dev")

    compileOnly("org.projectlombok:lombok:1.18.44")
    annotationProcessor("org.projectlombok:lombok:1.18.44")
    testCompileOnly("org.projectlombok:lombok:1.18.44")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.44")
    testImplementation("junit:junit:4.13.2")

    // CrystalGraphics, at COMPILE time only.
    //
    // integration.gradle.kts already adds the crystalgraphics MOD as `devOnlyNonPublishable`, which puts
    // it on the dev RUN classpath and not the compile one -- so `com.crystalgraphics.platform.*` and
    // `com.crystalgraphics.api.render.*` were invisible to javac while being present at runtime, which
    // reads as a missing dependency when it is really a missing configuration.
    //
    // compileOnly and never `api`/`implementation`, exactly as :core declares them: CrystalGraphics is
    // the parent MOD and is always present at runtime, so bundling any of it here would ship a second
    // copy of classes the crystalgraphics jar already provides -- and two copies of CgPlatform means two
    // registries, one of which is empty.
    compileOnly("com.crystalgraphics:core:1.0.0")
    compileOnly("com.crystalgraphics:platform:1.0.0")

    // The language stack -- tree-sitter grammars and the ECJ/Rhino engine bands.
    //
    // compileOnly for the same reason :core is: :language compiles to Java 21 bytecode, and FML's
    // ModDiscoverer opens every jar on the dev run classpath with asm-debug-all-5.0.3, which cannot read
    // it. The classes reach runtime through the shadow jar, downgraded by jvmdg.
    compileOnly project(':language')

    // Taffy: SHADED, because nothing else ships it. CrystalGUI is the only consumer -- UIElement and
    // ElementStyle hold TaffyStyle/NodeId fields and no Taffy type ever crosses into CrystalGraphics --
    // so relocating it can only rewrite references this jar also owns.
    shadowImplementation("dev.vfyjxf:taffy:${taffy_version}")

    // JOML: compileOnly, and it MUST NOT be shadowImplementation.
    //
    // `shadowImplementation` RELOCATES -- dependencies.gradle's own header says "included in your jar
    // under a renamed package name" -- and the relocation rewrites every reference in the bundled
    // classes, including references to CrystalGraphics API whose signatures mention JOML types. So
    // CgUiPaintContext went looking for:
    //
    //     CgFrameData.viewMatrix : Lcom/crystalgui/shadow/org/joml/Matrix4f;
    //
    // while CrystalGraphics ships org/joml unrelocated and declares it Lorg/joml/Matrix4f;. The field
    // descriptor is part of resolution, so that is a NoSuchFieldError -- naming a field that plainly
    // exists in both jars, which is what makes it read as a stale build rather than a shading problem.
    //
    // THE RULE: a library whose types appear in a cross-module signature can never be relocated by one
    // side of that boundary. CrystalGraphics is the parent mod and always present, so JOML is simply
    // provided -- the same treatment com.crystalgraphics:core and :platform get above, and what
    // core/build.gradle.kts already does with its own compileOnly("org.joml:joml").
    compileOnly("org.joml:joml:${jomlVersion}")
}
