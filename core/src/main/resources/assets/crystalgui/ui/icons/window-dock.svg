<!-- Drawn for CrystalGUI to Feather's geometry and stroke conventions, not copied from any icon set.
     "Put this back in its region": a frame with a panel band down one side, which is what a docked tool
     window looks like from across the room. An inward arrow was the other candidate and says "collapse"
     rather than "re-attach" — the mark has to distinguish Dock from the ✕ four pixels away from it.
     Stroked in currentColor like x.svg beside it, so the caption's own colour reaches it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5 L9 19"/></svg>
