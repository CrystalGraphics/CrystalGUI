<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <!-- Background matching the 3D viewport dark grey -->
    <rect width="100%" height="100%" fill="#3b3b3b" />

    <defs>
        <!-- 
          X-Axis Normal (Red): Left half is 0. 
          Right half uses true linear-to-sRGB gamma correction to fix the visual weight.
        -->
        <linearGradient id="normalX" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#000000" />
            <stop offset="50%" stop-color="#000000" />
            <stop offset="55%" stop-color="#590000" />
            <stop offset="60%" stop-color="#7b0000" />
            <stop offset="65%" stop-color="#940000" />
            <stop offset="70%" stop-color="#aa0000" />
            <stop offset="75%" stop-color="#bb0000" />
            <stop offset="80%" stop-color="#cb0000" />
            <stop offset="85%" stop-color="#d90000" />
            <stop offset="90%" stop-color="#e70000" />
            <stop offset="95%" stop-color="#f30000" />
            <stop offset="100%" stop-color="#ff0000" />
        </linearGradient>

        <!-- 
          Y-Axis Normal (Green): Bottom half is 0. 
          Top half uses true linear-to-sRGB gamma correction to balance the yellow quadrant.
        -->
        <linearGradient id="normalY" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff00" />
            <stop offset="5%" stop-color="#00f300" />
            <stop offset="10%" stop-color="#00e700" />
            <stop offset="15%" stop-color="#00d900" />
            <stop offset="20%" stop-color="#00cb00" />
            <stop offset="25%" stop-color="#00bb00" />
            <stop offset="30%" stop-color="#00aa00" />
            <stop offset="35%" stop-color="#009400" />
            <stop offset="40%" stop-color="#007b00" />
            <stop offset="45%" stop-color="#005900" />
            <stop offset="50%" stop-color="#000000" />
            <stop offset="100%" stop-color="#000000" />
        </linearGradient>
    </defs>

    <!-- Base circle mapping the X-axis normals (Red channel) -->
    <circle cx="250" cy="250" r="230" fill="url(#normalX)" />

    <!-- Overlay circle mapping the Y-axis normals (Green channel), blended perfectly -->
    <circle cx="250" cy="250" r="230" fill="url(#normalY)" style="mix-blend-mode: screen;" />
</svg>
