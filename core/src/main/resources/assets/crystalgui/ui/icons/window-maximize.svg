<!-- Drawn for CrystalGUI to Feather's geometry and stroke conventions, not copied from any icon set.
     A window control: the single outlined square every window manager since Windows 95 has drawn for
     maximise. Stroked in currentColor like x.svg and window-minimize.svg beside it, so the title bar's
     own colour reaches it and no _dark companion is needed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
