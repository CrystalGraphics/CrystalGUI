<!-- Drawn for CrystalGUI to Feather's geometry and stroke conventions, not copied from any icon set.
     currentColor rather than a fixed grey, so it needs no _dark variant: CgUiSvg.withVariant falls back
     to this file, and the colour arrives from the cascade like any other chrome mark. -->
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <polygon points="6 4 20 12 6 20 6 4"/>
</svg>
