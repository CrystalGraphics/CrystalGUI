<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>CrystalGraphics</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C8E6"/>
      <stop offset="0.38" stop-color="#1E40C8"/>
      <stop offset="0.75" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#A3268F"/>
    </linearGradient>
    <radialGradient id="light" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#5EEAFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5EEAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#FF5FC8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF5FC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" stop-color="#DCE8FF"/>
      <stop offset="0.5" stop-color="#A9C6FF"/>
      <stop offset="1" stop-color="#6F9BF0"/>
    </linearGradient>
    <filter id="drop" filterUnits="userSpaceOnUse" x="-10" y="-10" width="84" height="84" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dy="2" result="blur"/>
      <feFlood flood-color="#0A0F3A" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14" fill="url(#light)"/>
  <rect width="64" height="64" rx="14" fill="url(#warm)"/>
  <path d="M 44.63 20.62 A 17 17 0 1 0 41.01 46.42" fill="none" stroke="url(#ink)" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round" filter="url(#drop)"/>
  <g filter="url(#drop)">
    <polygon points="40.56,31.22 43.27,35.9 37.18,35.9" fill="#F4F0FF" stroke="#F4F0FF" stroke-width="0.15" stroke-linejoin="round"/>
    <polygon points="40.56,31.22 50.7,31.22 48,35.9 43.27,35.9" fill="#DCE2FF" stroke="#DCE2FF" stroke-width="0.15" stroke-linejoin="round"/>
    <polygon points="50.7,31.22 54.08,35.9 48,35.9" fill="#BFD4FF" stroke="#BFD4FF" stroke-width="0.15" stroke-linejoin="round"/>
    <polygon points="37.18,35.9 43.27,35.9 45.63,49.42" fill="#DCE2FF" stroke="#DCE2FF" stroke-width="0.15" stroke-linejoin="round"/>
    <polygon points="43.27,35.9 48,35.9 45.63,49.42" fill="#BFD4FF" stroke="#BFD4FF" stroke-width="0.15" stroke-linejoin="round"/>
    <polygon points="48,35.9 54.08,35.9 45.63,49.42" fill="#7FB4EE" stroke="#7FB4EE" stroke-width="0.15" stroke-linejoin="round"/>
  </g>
</svg>
