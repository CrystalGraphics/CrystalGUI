# Root gradle.properties — universal project config only.
#
# MC version-specific properties (minecraftVersion, forgeVersion, mixins, coreModClass, etc.)
# live in the version subproject: runtime/mc/1710/gradle.properties
#
# NOTE: gtnhsettingsconvention (applied in settings.gradle.kts) reads from this file at
# settings-evaluation time. modName/modId/modGroup are kept here for that reason.

# Human-readable mod name
modName = CrystalGUI

# Case-sensitive mod identifier
modId = crystalgui

# Root package
modGroup = com.crystalgui

# Mod version
modVersion = 1.0.0

# Whether to use modGroup as the maven publishing group.
useModGroupForPublishing = true

# Non-GTNH Gradle flags
# CC disabled: ModDevGradle (legacyForge and NeoForge, both used by runtime/mc/modern) does not support configuration cache.
org.gradle.configuration-cache = false
# RESTORED. This was never the problem, and turning it off did not fix what it was turned off for.
#
# The real requirement is --max-workers=1 for anything that builds :runtime:mc:1710, and it is NOT the same knob:
# org.gradle.parallel governs the ROOT build, while Gradle still runs an INCLUDED build's tasks on
# separate workers -- so :runtime:mc:1710 and :CrystalGraphics:runtime:mc:1710 hashed the shared Minecraft source tree
# concurrently and RFG threw ConcurrentModificationException out of HashUtils.addDirContentsToHash.
# It surfaces as "Could not evaluate onlyIf predicate for task ':runtime:mc:1710:mergeVanillaSidedJars'", is
# intermittent, and the task SUCCEEDS when run alone -- which makes it read as corruption rather than a
# race. See plan_m12.md 25.9.
org.gradle.parallel = true
# 4 GB heap: the Forge/NeoForge deobfuscation pipeline (SRG remapping, MC decompile) is memory-hungry.
# Do not drop below 3 GB -- an OOM mid-decompile reads as a hang.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Shared dependency versions — referenced by :core and :runtime:mc:1710 build scripts
yoga_version=1.0.0
# Taffy: the VERSION OF UPSTREAM THIS FORK IS BASED ON, not a coordinate anything resolves any more --
# :taffy is a vendored module (see taffy/MODIFICATIONS.md). Kept so the baseline for the next re-vendor
# is written down in the place versions are written down.
taffy_version=1.1.4
# fastutil: GONE, 2026-09-10, and this note is kept because the version that used to sit here is the
# thing somebody will try to add back. It was Taffy's dependency for SEVEN types, and the merged jar
# carried 12,808 relocated entries for them -- 19.65 MB of 31.20, 63% of the mod. They are vendored in
# `dev.vfyjxf.taffy.collection` now (IntList/IntArrayList, FloatList/FloatArrayList,
# Int2FloatMap/Int2FloatOpenHashMap, Long2ObjectOpenHashMap), which took the jar to 8.65 MB.
#
# If a new dependency drags fastutil back in, `checkSingleJar` fails on the `it/unimi/dsi/fastutil/`
# prefix rather than silently restoring the 19 MB.
jomlVersion=1.10.8
# ASM: :language compiles against it and every loader must SHIP it. Here rather than in
# language/build.gradle.kts because two spellings of one version is exactly the hazard that file
# spends a paragraph on — and the loader that ships the wrong one fails at a user, not at a build.
asmVersion=9.10
dep.lombok = 1.18.40
dep.joml = 1.10.1
dep.lwjgl = 2.9.4-nightly-20150209
dep.log4j = 2.0-beta9
dep.jabel = 1.0.0
dep.junit = 4.13.2
dep.jdk.toolchain = 17


# The 1.20.x era's toolchain-wide pins. EVERY OTHER modern pin is per node, in
# runtime/mc/modern/<loader>/versions/<version>/gradle.properties: a node IS a Minecraft version, and a
# root-level key cannot describe two of them.
modern.mixin            = 0.8.5
modern.mixinextras      = 0.3.5

# runtime/mc/shared logs one line and names nothing else. 1.7.10's own log4j, so a class compiled here
# cannot reach an API a newer runtime supplies -- the same rule every pin in this file follows.
mcshared.log4j          = 2.0-beta9
