# Root gradle.properties — universal project config only.
#
# MC version-specific properties (minecraftVersion, forgeVersion, mixins, coreModClass, etc.)
# live in the version subproject: mc1710/gradle.properties
#
# NOTE: gtnhsettingsconvention (applied in settings.gradle.kts) reads from this file at
# settings-evaluation time. modName/modId/modGroup are kept here for that reason.

# Human-readable mod name
modName = CrystalGUI

# Case-sensitive mod identifier
modId = crystalgui

# Root package
modGroup = com.crystalgui

# Mod version
modVersion = 1.0.0

# Whether to use modGroup as the maven publishing group.
useModGroupForPublishing = true

# Non-GTNH Gradle flags
# CC disabled: ModDevGradle (mc1201/forge legacyForge, mc1201/neoforge) does not support configuration cache.
org.gradle.configuration-cache = false
# RESTORED. This was never the problem, and turning it off did not fix what it was turned off for.
#
# The real requirement is --max-workers=1 for anything that builds :mc1710, and it is NOT the same knob:
# org.gradle.parallel governs the ROOT build, while Gradle still runs an INCLUDED build's tasks on
# separate workers -- so :mc1710 and :CrystalGraphics:mc1710 hashed the shared Minecraft source tree
# concurrently and RFG threw ConcurrentModificationException out of HashUtils.addDirContentsToHash.
# It surfaces as "Could not evaluate onlyIf predicate for task ':mc1710:mergeVanillaSidedJars'", is
# intermittent, and the task SUCCEEDS when run alone -- which makes it read as corruption rather than a
# race. See plan_m12.md 25.9.
org.gradle.parallel = true
# 4 GB heap: Forge/NeoForge deobfuscation pipeline (SRG remapping, MC decompile) is memory-intensive.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Shared dependency versions — referenced by :core and :mc1710 build scripts
yoga_version=1.0.0
# Taffy: the VERSION OF UPSTREAM THIS FORK IS BASED ON, not a coordinate anything resolves any more --
# :taffy is a vendored module (see taffy/MODIFICATIONS.md). Kept so the baseline for the next re-vendor
# is written down in the place versions are written down.
taffy_version=1.1.4
# fastutil: Taffy's own dependency, for SEVEN types. Declared here rather than inside :taffy so it obeys
# the one-spelling rule the asmVersion comment below states. NOTE the cost, measured: the shipped mod jar
# carries 12,808 relocated fastutil entries -- ~22MB of a 48MB jar -- for IntList/IntArrayList,
# FloatList/FloatArrayList, Int2FloatMap/Int2FloatOpenHashMap and Long2ObjectOpenHashMap. Replacing them
# with primitive collections of our own is a large, cheap win now that the port is ours; it is deliberately
# NOT done inside spike S1, which is meant to stay small.
fastutil_version=8.5.12
jomlVersion=1.10.8
# ASM: :language compiles against it and every loader must SHIP it. Here rather than in
# language/build.gradle.kts because two spellings of one version is exactly the hazard that file
# spends a paragraph on — and the loader that ships the wrong one fails at a user, not at a build.
asmVersion=9.10
dep.lombok = 1.18.40
dep.joml = 1.10.1
dep.lwjgl = 2.9.4-nightly-20150209
dep.log4j = 2.0-beta9
dep.jabel = 1.0.0
dep.junit = 4.13.2
dep.jdk.toolchain = 17


# mc1201 version pins
mc1201.minecraft        = 1.20.1
mc1201.neoform          = 1.20.1-20230612.114412
mc1201.neoforge         = 20.1.84
mc1201.fabric.loader    = 0.15.11
mc1201.fabric.api       = 0.92.0+1.20.1
mc1201.forge            = 47.2.0
mc1201.parchment.mc     = 1.20.1
mc1201.parchment        = 2023.09.03
mc1201.mixin            = 0.8.5
mc1201.mixinextras      = 0.3.5
mc1201.java             = 17

# mc1204 version pins (NeoForge retarget — mc1201/neoforge/ targets MC 1.20.4)
mc1204.minecraft        = 1.20.4
mc1204.neoforge         = 20.4.251
mc1204.parchment.mc     = 1.20.4
mc1204.parchment        = 2024.04.14
